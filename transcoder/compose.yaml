services:
  transcoder:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TRANSCODER_TOKEN: ${TRANSCODER_TOKEN:?Set a random secret of at least 32 characters}
    volumes:
      - media:/data
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  media:
