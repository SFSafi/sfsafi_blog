name: Validate Astro prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s transcoder -p 'test_*.py' -v
      - run: npm run check
      - run: npm run build:worker
      - run: npm run build:bot
      - run: PLAYWRIGHT_BROWSERS_PATH=/tmp/sfsafi-browsers npx playwright install --with-deps chromium
      - run: PLAYWRIGHT_BROWSERS_PATH=/tmp/sfsafi-browsers npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-dist
          path: dist
          retention-days: 7
